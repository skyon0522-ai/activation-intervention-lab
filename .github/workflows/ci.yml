name: CPU regression candidate
on: [push, pull_request]
jobs:
  regression:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
      HF_HUB_DISABLE_XET: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install ".[test]" -c constraints-verified.txt
      - run: python -m pytest tests -q
      - run: python -m build
      - run: activation-lab --output "${{ runner.temp }}/activation-report" --benchmark-repeats 1
      - uses: actions/upload-artifact@v4
        with:
          name: report-${{ matrix.os }}
          path: ${{ runner.temp }}/activation-report
